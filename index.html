<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El campo de girasoles</title>
<meta name="description" content="Una dinámica de cumpleaños: ordenar los girasoles según los recuerdos que guardan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Karla:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<canvas id="lienzo-fiesta" aria-hidden="true"></canvas>

<main id="app">

  <!-- ─────────────  1. BIENVENIDA  ───────────── -->
  <section class="escena escena--activa" id="escena-bienvenida" data-escena="bienvenida" tabindex="-1">
    <div class="bienvenida">
      <p class="etiqueta" id="bv-saludo"></p>
      <h1 class="titular" id="bv-titulo"></h1>
      <p class="entradilla" id="bv-subtitulo"></p>
    </div>
    <button class="pista" id="bv-continuar" type="button"></button>
  </section>

  <!-- ─────────────  2. INTRODUCCIÓN  ───────────── -->
  <section class="escena" id="escena-intro" data-escena="intro" tabindex="-1">
    <div class="hoja-texto">
      <p class="texto-guion" id="intro-texto"></p>
      <div class="hoja-texto__pie">
        <span class="cuenta" id="intro-cuenta"></span>
        <button class="pista" id="intro-continuar" type="button"></button>
      </div>
    </div>
  </section>

  <!-- ─────────────  3. EL CAMPO (juego)  ───────────── -->
  <section class="escena escena--campo" id="escena-juego" data-escena="juego" tabindex="-1">

    <div class="cielo">
      <div class="sol" id="sol"><span class="sol__nucleo"></span></div>
      <div class="nube nube--a"></div>
      <div class="nube nube--b"></div>
      <div class="nube nube--c"></div>
      <div class="abeja" id="abeja" aria-hidden="true"></div>
      <div class="mariposa" id="mariposa" aria-hidden="true"></div>
      <p class="consigna" id="consigna"></p>
    </div>

    <svg class="haz" id="haz" aria-hidden="true" preserveAspectRatio="none"></svg>

    <div class="tierra">
      <div class="macetas" id="macetas"></div>
    </div>

    <div class="proyeccion proyeccion--dormida" id="proyeccion">
      <p class="proyeccion__espera" id="proy-espera"></p>
      <article class="proyeccion__hoja">
        <p class="proyeccion__orden" id="proy-marca"></p>
        <h2 class="proyeccion__titulo" id="proy-titulo"></h2>
        <p class="proyeccion__texto" id="proy-texto"></p>
      </article>
    </div>

    <div class="banca">
      <div class="semillero">
        <p class="etiqueta etiqueta--tierra" id="semillero-titulo"></p>
        <div class="semillero__fila" id="semillero"></div>
      </div>
      <div class="controles">
        <p class="aviso" id="aviso" role="status" aria-live="polite"></p>
        <button class="boton" id="btn-comprobar" type="button" disabled></button>
      </div>
    </div>

  </section>

  <!-- ─────────────  4. VICTORIA  ───────────── -->
  <section class="escena" id="escena-victoria" data-escena="victoria" tabindex="-1">
    <div class="hoja-texto hoja-texto--ancha">
      <p class="etiqueta" id="vic-etiqueta"></p>
      <h2 class="titular titular--medio" id="vic-titulo"></h2>
      <p class="texto-guion" id="vic-texto"></p>
      <ol class="linea-tiempo" id="linea-tiempo"></ol>
      <div class="hoja-texto__pie">
        <span></span>
        <button class="boton" id="vic-continuar" type="button"></button>
      </div>
    </div>
  </section>

  <!-- ─────────────  5. CIERRE  ───────────── -->
  <section class="escena" id="escena-final" data-escena="final" tabindex="-1">
    <div class="hoja-texto hoja-texto--ancha">
      <p class="etiqueta" id="fin-etiqueta"></p>
      <h2 class="titular titular--medio" id="fin-titulo"></h2>
      <p class="texto-guion" id="fin-texto"></p>
      <ul class="lista-datos" id="lista-datos"></ul>
      <p class="nota" id="fin-nota"></p>
      <div class="hoja-texto__pie">
        <span class="cuenta" id="fin-copiado" role="status" aria-live="polite"></span>
        <button class="boton boton--suave" id="btn-copiar" type="button"></button>
      </div>
    </div>
  </section>

</main>

<script src="js/config.js"></script>
<script src="js/escena.js"></script>
<script src="js/celebracion.js"></script>
<script src="js/juego.js"></script>
</body>
</html>
